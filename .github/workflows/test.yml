name: Tests

on:
  push:
    # develop is where v1.0 is being assembled, so it gets the same gate as
    # main. Without this, a long-lived branch accumulates commits that have
    # only ever run on one developer's machine.
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims 3.9 through 3.13; test the ends and the middle
        # rather than trusting the classifier. Windows is here because it is
        # where this tool is actually developed and used, and because the
        # path/pipe/encoding differences are real -- a closed-pipe bug that
        # only reproduces on Windows has already been fixed once.
        os: [ubuntu-latest]
        python-version: ["3.9", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap
        # exercises the --sandbox bwrap profile for real. Ubuntu 24.04 blocks
        # unprivileged user namespaces via AppArmor, so relax that sysctl for
        # the runner; the sandbox tests skip gracefully if it still cannot run.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis,ml,mcp]" pytest
      - name: Run tests
        run: pytest -q
