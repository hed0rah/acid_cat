name: Tests

on:
  push:
    # develop is where v1.0 is being assembled, so it gets the same gate as
    # main. Without this, a long-lived branch accumulates commits that have
    # only ever run on one developer's machine.
    branches: [main, develop]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # pyproject claims 3.10 through 3.13; test the ends and the middle
        # rather than trusting the classifier. 3.9 was claimed until CI proved
        # `pip install acidcat[mcp]` (and therefore [all]) could not resolve on
        # it -- mcp requires >=3.10 -- and 3.9 has been EOL since 2025-10.
        # Windows is here because it is where this tool is developed and used,
        # and because its path/pipe/encoding differences are real rather than
        # theoretical: a closed-pipe bug and a hardcoded /tmp in a test have
        # each already cost a fix.
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install bubblewrap
        # exercises the --sandbox bwrap profile for real. Ubuntu 24.04 blocks
        # unprivileged user namespaces via AppArmor, so relax that sysctl for
        # the runner; the sandbox tests skip gracefully if it still cannot run.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install ffmpeg
        # Not a runtime dependency -- acidcat bundles no decoders. It builds the
        # specimens for the deep-checksum and concealment tests: a real FLAC to
        # verify frame CRCs against, a real 24-bit WAV for the not-applicable
        # path. Those tests guard `validate --deep`, a headline of 1.0.
        #
        # Without it they SKIP, and a skipped test is a green run that checked
        # nothing -- the same failure as the `ml`/`tui` extras below, which
        # silently skipped whole suites while every run reported success. The
        # conftest guard makes absence graceful for a contributor's laptop; it
        # is not a licence for CI to stop checking.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ffmpeg
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            choco install ffmpeg -y --no-progress
          fi
          ffmpeg -version | head -1
      - name: Install
        # `ml` was requested here and is not a defined extra -- pip warns and
        # carries on, so it looked installed and never was. `tui` and `crypto`
        # were simply missing, which silently skipped the whole Textual suite
        # and the encrypted-disc tests on every run.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analysis,mcp,tui,crypto]" pytest pytest-cov
      - name: Run tests
        # -rs prints WHY things skipped. Without it the run reported "114
        # skipped" and gave nobody a way to find out what was not covered.
        run: pytest -q -rs --cov=acidcat --cov-report=term-missing:skip-covered
